<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="8 meningslösa projekt. ett (1) mer onödigt än de andra. faktiskt." />
    <meta name="theme-color" content="#0a0807" />
    <!-- Delning (Slack, LinkedIn m.fl.): og:image och og:url måste vara fullständiga adresser. Byt domän här vid egen domän. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="äventyret" />
    <meta property="og:title" content="äventyret hackathon 2026" />
    <meta property="og:description" content="8 meningslösa projekt. ett (1) mer onödigt än de andra. faktiskt." />
    <meta property="og:url" content="https://aventyret-hackaton.github.io/vinnarmaskinen/" />
    <meta property="og:image" content="https://aventyret-hackaton.github.io/vinnarmaskinen/share/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ett mörkt källarrum en regnig kväll. en gammal dator på skrivbordet visar gröna rader text." />
    <meta property="og:locale" content="sv_SE" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/ReplicaLLWeb-Regular.woff2" as="font" crossorigin type="font/woff2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=DotGothic16&display=swap" rel="stylesheet" />
    <script type="module" src="/src/entry.ts"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>

      <!-- Scen 2: fullskärmsvideo + HUD -->
      <section id="videoLayer" class="layer hidden">
        <video id="v1" playsinline preload="auto"></video>
        <video id="v2" playsinline preload="auto" loop></video>
        <div id="figure" class="hidden"><div class="fk"></div><div class="fn"></div><div class="fl"></div></div>
        <div id="hud"></div>
      </section>

      <!-- Frågan efter filmen, över hela skärmen som boot-skärmen -->
      <section id="continue" class="layer hidden"><div class="gate-main" id="continueMain"></div></section>

      <!-- Boot-gate: användargesten som låser upp ljud -->
      <section id="gate" class="layer">
        <div class="gate-log" id="gateLog"></div>
        <div class="gate-main"><span id="gateCmd"></span><i class="cursor"></i></div>
        <button id="gateBtn" class="enter" type="button"><kbd>enter</kbd><span>för att ansluta</span></button>
        <div class="gate-foot"><span>f1 hjälp</span><span>f2 ljud på</span><span id="gateClock">00:00:00:00</span></div>
      </section>

      <div id="flash"></div>
      <div id="crt"></div>
    </div>
  </body>
</html>
